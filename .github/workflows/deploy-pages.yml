name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_QLIK_TENANT_HOST: cliqvenus.ap.qlikcloud.com
          VITE_QLIK_APP_ID: ${{ secrets.VITE_QLIK_APP_ID }}
          VITE_QLIK_WEB_INTEGRATION_ID: M56RlXSVJ0dcpleLLpIdU1oPwI9sDQxJ
          VITE_APP_ORIGIN: https://priii08.github.io
          VITE_BASE_PATH: /OTT-Streaming-Analytics-Dashboard/


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
